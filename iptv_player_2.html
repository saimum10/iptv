<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
:root{--bg:#0f0f13;--bg2:#1a1a24;--bg3:#22222f;--bgc:#1e1e2a;--acc:#7c6af7;--acch:#9b8dff;--accg:rgba(124,106,247,.25);--tp:#f0eeff;--ts:#9993cc;--tm:#5c5880;--bdr:rgba(124,106,247,.15);--bdrh:rgba(124,106,247,.4);--plbg:rgba(124,106,247,.12);--plbdr:rgba(124,106,247,.6);--err:#ff5c7a;--ok:#4dffb4;--sh:0 4px 24px rgba(0,0,0,.5);--r:10px;--rs:6px}
.light{--bg:#f0eeff;--bg2:#e8e4ff;--bg3:#ddd8ff;--bgc:#f8f6ff;--acc:#5b46e8;--acch:#7c6af7;--accg:rgba(91,70,232,.15);--tp:#1a1240;--ts:#4a3fa0;--tm:#9990cc;--bdr:rgba(91,70,232,.2);--bdrh:rgba(91,70,232,.5);--plbg:rgba(91,70,232,.08);--plbdr:rgba(91,70,232,.5);--err:#d63055;--ok:#0fad6e;--sh:0 4px 24px rgba(91,70,232,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tp);transition:background .3s,color .3s;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--bdr);position:fixed;top:0;left:0;right:0;z-index:100;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;color:var(--acc);white-space:nowrap}
.logo svg{width:22px;height:22px}
.hstat{font-size:.72rem;color:var(--tm);white-space:nowrap}
.hr{display:flex;align-items:center;gap:8px}
/* Header search */
.hsw{position:relative;display:flex;align-items:center}
.hsearch{padding:6px 10px 6px 30px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--bdr);color:var(--tp);font-size:.78rem;outline:none;transition:border .2s,width .2s;width:180px}
.hsearch:focus{border-color:var(--acc);width:220px}
.hsearch::placeholder{color:var(--tm)}
.hsi{position:absolute;left:9px;color:var(--tm);font-size:.8rem;pointer-events:none}
.ibtn{background:var(--bg3);border:1px solid var(--bdr);color:var(--ts);border-radius:var(--rs);padding:6px 10px;cursor:pointer;font-size:.78rem;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap}
.ibtn:hover{background:var(--accg);border-color:var(--bdrh);color:var(--tp)}
.app-gone{display:none}
/* ── HOME / GRID ── */
.home{height:calc(100vh - 52px);margin-top:52px;overflow-y:auto;background:var(--bg)}
.home::-webkit-scrollbar{width:5px}
.home::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px}
/* Grid card */
.gc{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.gc:hover{transform:translateY(-3px);border-color:var(--bdrh);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.gc.pl{border-color:var(--acc);box-shadow:0 0 0 2px var(--accg)}
.gc-thumb{height:100px;background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gc-thumb img{width:70%;height:70%;object-fit:contain}
.gc-thumb .gc-fb{font-size:1.4rem;font-weight:700;color:var(--tm);letter-spacing:.05em}
.gc-live{position:absolute;top:6px;right:6px;background:#e53935;color:#fff;font-size:.58rem;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.05em}
.gc-body{padding:8px 10px 10px}
.gc-name{font-size:.8rem;font-weight:600;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-grp{font-size:.65rem;color:var(--tm);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nores{padding:40px;text-align:center;color:var(--tm);font-size:.9rem}

/* ── PLAYER PANEL (slide up) ── */
.player-panel{
  position:fixed;bottom:0;left:0;right:0;
  height:0;
  background:var(--bg);
  border-radius:16px 16px 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,.6);
  z-index:300;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:height .38s cubic-bezier(.4,0,.2,1);
}
.player-panel.open{height:92vh}
/* Panel drag handle */
.panel-handle{display:flex;justify-content:center;padding:10px 0 6px;flex-shrink:0;cursor:grab}
.panel-handle:active{cursor:grabbing}
.handle-bar{width:40px;height:4px;background:var(--tm);border-radius:4px;opacity:.5}
/* Panel header */
.panel-hdr{display:flex;align-items:center;gap:10px;padding:4px 14px 10px;flex-shrink:0;border-bottom:1px solid var(--bdr)}
.panel-back{background:none;border:none;color:var(--ts);cursor:pointer;padding:6px;border-radius:var(--rs);display:flex;align-items:center;transition:color .15s,background .15s}
.panel-back:hover{color:var(--tp);background:var(--bg3)}
.panel-title{flex:1;font-weight:600;font-size:.9rem;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ── Player video area ── */
.pa{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;user-select:none}
video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}

/* ── Panel related list ── */
.panel-list{flex:1;overflow-y:auto;padding:8px 0}
.panel-list::-webkit-scrollbar{width:4px}
.panel-list::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
/* Reuse .ci styles */
.ci{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .18s}
.ci:hover{background:var(--bg3);border-left-color:var(--bdrh)}
.ci.pl{background:var(--plbg);border-left-color:var(--acc)}
.cn{font-size:.65rem;color:var(--tm);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.cl{width:34px;height:34px;border-radius:var(--rs);object-fit:contain;background:var(--bg3);border:1px solid var(--bdr);flex-shrink:0}
.clf{width:34px;height:34px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--tm);flex-shrink:0;font-weight:600}
.cinfo{flex:1;min-width:0}
.cname{font-size:.8rem;font-weight:500;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgrp{font-size:.65rem;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex-shrink:0}
.ci:hover .ca,.ci.pl .ca{opacity:1}
.cbtn{background:var(--bg);border:1px solid var(--bdr);color:var(--ts);border-radius:var(--rs);width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.7rem;transition:all .15s;padding:0}
.cbtn:hover{background:var(--accg);border-color:var(--acc);color:var(--acc)}
.cbtn.pb:hover{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ── Backdrop ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.show{opacity:1;pointer-events:all}

/* ── Tap ripple center icon ── */
.tap-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(0,0,0,.5);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;pointer-events:none;transition:transform .15s,opacity .3s;opacity:0;z-index:20}
.tap-icon.pop{transform:translate(-50%,-50%) scale(1);opacity:1}

/* ── Video overlay controls ── */
.pov{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.88) 100%);display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10}
.pa:hover .pov,.pov.vis{opacity:1 !important;pointer-events:all !important}

/* ── Progress / seek bar ── */
.prog-wrap{padding:0 14px 4px;display:flex;align-items:center;gap:8px}
.prog-bar{flex:1;position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.25);cursor:pointer;transition:height .15s}
.prog-bar:hover{height:6px}
.prog-fill{position:absolute;left:0;top:0;height:100%;background:var(--acc);border-radius:4px;pointer-events:none;width:0%}
.prog-handle{position:absolute;top:50%;right:-6px;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#fff;pointer-events:none;box-shadow:0 0 4px rgba(0,0,0,.5);display:none}
.prog-bar:hover .prog-handle{display:block}
.prog-time{color:rgba(255,255,255,.8);font-size:.72rem;white-space:nowrap;min-width:36px;text-align:center}

/* ── Controls row ── */
.pc{padding:6px 14px 12px;display:flex;align-items:center;gap:8px}
.ctb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:var(--rs);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ctb:hover{background:rgba(255,255,255,.28)}
.ctb:active{transform:scale(.9)}
.vw{display:flex;align-items:center;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,.35);border-radius:4px;outline:none;cursor:pointer;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 3px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none;box-shadow:0 0 3px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;background:rgba(255,255,255,.35);border-radius:4px}
/* Volume fill — dynamic via JS */
#vs{width:80px;accent-color:#fff}
.csp{flex:1}
.npl{font-size:.75rem;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}

/* ── Quality selector button ── */
.qbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--rs);padding:0 8px;height:30px;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;position:relative;display:flex;align-items:center;gap:5px}
.qbtn:hover{background:rgba(255,255,255,.28)}
.qbtn .qlabel{background:var(--acc);color:#fff;border-radius:3px;padding:1px 5px;font-size:.63rem;font-weight:700}

/* ── Quality dropdown panel ── */
.qdrop{position:absolute;top:calc(100% + 6px);right:0;background:rgba(18,18,28,.97);border:1px solid var(--bdrh);border-radius:var(--rs);min-width:160px;overflow:hidden;z-index:200;box-shadow:var(--sh);display:none}
.qdrop.open{display:block}
.qdrop-title{padding:8px 12px;font-size:.7rem;color:var(--tm);border-bottom:1px solid var(--bdr);font-weight:600;letter-spacing:.04em}
.ql{padding:8px 12px;font-size:.8rem;color:var(--tp);cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ql:hover{background:var(--accg)}
.ql.act{color:var(--acc);font-weight:600}
.ql .ql-badge{font-size:.65rem;color:var(--tm);background:var(--bg3);border-radius:3px;padding:1px 5px}
.ql.act .ql-badge{background:var(--accg);color:var(--acc)}

/* ── Spinner / overlay ── */
.so{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.75);pointer-events:none;opacity:0;transition:opacity .3s;z-index:50}
.so.show{opacity:1;pointer-events:all}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.smsg{color:#fff;font-size:.85rem;text-align:center;max-width:260px}
.rbt{background:var(--acc);border:none;color:#fff;padding:7px 18px;border-radius:var(--rs);cursor:pointer;font-size:.82rem;margin-top:4px;transition:background .2s}
.rbt:hover{background:var(--acch)}

/* ── Info bar ── */
.ibar{background:var(--bg2);border-top:1px solid var(--bdr);padding:8px 14px;display:flex;align-items:center;gap:12px;min-height:46px;font-size:.78rem;flex-shrink:0}
.il{width:30px;height:30px;border-radius:var(--rs);object-fit:contain;background:var(--bg3);border:1px solid var(--bdr)}
.ilf{width:30px;height:30px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--tm);font-weight:600}
.id{flex:1;min-width:0}
.iname{font-weight:600;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.igrp{color:var(--tm);font-size:.7rem}
.iph{color:var(--tm);font-style:italic}
.ibadge{background:var(--accg);border:1px solid var(--bdrh);color:var(--acc);border-radius:4px;padding:2px 8px;font-size:.68rem;white-space:nowrap}
.kbh{color:var(--tm);font-size:.68rem;display:flex;gap:10px;flex-wrap:wrap}
.kbh span{background:var(--bg3);border:1px solid var(--bdr);border-radius:3px;padding:1px 5px}

/* ── Toast ── */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--bdr);color:var(--tp);padding:8px 18px;border-radius:20px;font-size:.8rem;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MOBILE ── */
@media(max-width:700px){
  /* Channel grid: 2 columns on mobile */
  .grid{grid-template-columns:repeat(2,1fr) !important;gap:10px !important;padding:10px !important}
  .gc-thumb{height:80px !important}
  .gc-name{font-size:.72rem !important}
  .gc-grp{font-size:.6rem !important}
  /* Player panel: full screen slide up */
  .player-panel{border-radius:0 !important}
  .player-panel.open{height:100% !important}
  .kbh{display:none}
  #vs{width:50px}
  .npl{max-width:100px}
  .hstat{display:none}
  .ctb{width:40px;height:40px;font-size:1rem}
  .prog-bar{height:5px}
  .hsearch{width:130px}
}
@media(max-width:400px){
  .grid{grid-template-columns:repeat(2,1fr) !important}
  .hsearch{width:100px}
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>
    IPTV Player
  </div>
  <span class="hstat" id="totalCount">Loading...</span>
  <div class="hr">
    <div class="hsw">
      <span class="hsi">🔍</span>
      <input class="hsearch" type="text" id="searchInput" placeholder="Search channels..." oninput="filterChannels()">
    </div>
    <button class="ibtn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
  </div>
</header>

<!-- ══ CHANNEL GRID (Home view) ══ -->
<div class="home" id="home">
  <div class="grid" id="channelGrid"></div>
</div>

<!-- ══ PLAYER PANEL (slide up) ══ -->
<div class="player-panel" id="playerPanel">

  <!-- Panel drag handle -->
  <div class="panel-handle" id="panelHandle">
    <div class="handle-bar"></div>
  </div>

  <!-- Panel header -->
  <div class="panel-hdr">
    <button class="panel-back" onclick="closePlayer()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="panel-title" id="panelTitle">—</div>
    <div class="panel-hdr-right">
      <!-- Quality button in panel header -->
      <div style="position:relative">
        <button class="qbtn" id="qbtn" onclick="toggleQDrop(event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="qlabel" id="qLabel">AUTO</span>
        </button>
        <div class="qdrop" id="qdrop">
          <div class="qdrop-title">VIDEO QUALITY</div>
          <div id="qList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Video area -->
  <div class="pa" id="pa">
    <video id="vid" playsinline></video>

    <!-- Spinner -->
    <div class="so" id="so">
      <div class="spin" id="spin"></div>
      <div class="smsg" id="smsg">Loading stream...</div>
      <button class="rbt" id="rbt" onclick="retryStream()" style="display:none">⟳ Retry</button>
    </div>

    <!-- Tap flash icon -->
    <div class="tap-icon" id="tapIcon">▶</div>

    <!-- Video overlay controls -->
    <div class="pov" id="pov">
      <span style="flex:1"></span>
      <!-- Seek bar -->
      <div class="prog-wrap">
        <div class="prog-bar" id="progBar">
          <div class="prog-fill" id="progFill"></div>
          <div class="prog-handle"></div>
        </div>
        <span class="prog-time" id="progTime">LIVE</span>
      </div>
      <!-- Controls -->
      <div class="pc">
        <button class="ctb" onclick="prevCh()" title="Previous">⏮</button>
        <button class="ctb" id="pico" onclick="togglePlay()" title="Play/Pause">▶</button>
        <button class="ctb" onclick="nextCh()" title="Next">⏭</button>
        <button class="ctb" id="mb" onclick="toggleMute()" title="Mute">🔊</button>
        <div class="vw"><input type="range" id="vs" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)"></div>
        <span class="csp"></span>
        <span class="npl" id="npl">—</span>
        <span class="csp"></span>
        <button class="ctb" onclick="togglePiP()" title="PiP">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="15" rx="2"/><rect x="12" y="11" width="8" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="ctb" id="fsBtn" onclick="toggleFS()" title="Fullscreen">
          <svg id="fsIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <div class="kbh"><span>Space</span><span>M</span><span>←→</span><span>F</span><span>P</span></div>
      </div>
    </div>
  </div>

  <!-- Related channels list inside panel -->
  <div class="panel-list" id="panelList"></div>

</div>

<!-- Backdrop -->
<div class="backdrop" id="backdrop" onclick="closePlayer()"></div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════ M3U DATA ═══════════════════════ */
const RAW=`#EXTM3U
#EXTINF:-1 tvg-logo="https://raw.githubusercontent.com/falconcasthoster/images/refs/heads/main/FalconCast.png" group-title="Promo",FalconCast
https://raw.githubusercontent.com/falconcasthoster/promo/refs/heads/main/nolink/master.m3u8
#EXTINF:-1 tvg-logo="https://carboncredits.com/wp-content/uploads/2025/09/shutterstock_2306088965-e1757112807302.jpg" group-title="Football World Cup 2026",Football World Cup 2026

/* ═══════════════════════ PARSE M3U ═══════════════════════ */
function parseM3U(r){
  const lines=r.split('\n').map(l=>l.trim()).filter(Boolean),ch=[];
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#EXTINF')){
      const m=lines[i],url=lines[i+1]&&!lines[i+1].startsWith('#')?lines[i+1]:null;
      if(!url)continue;
      // Fix &amp; in URLs
      const cleanUrl=url.replace(/&amp;/g,'&');
      const lm=m.match(/tvg-logo="([^"]*)"/),gm=m.match(/group-title="([^"]*)"/),nm=m.match(/,(.+)$/);
      ch.push({name:nm?nm[1].trim():'Unknown',logo:lm?lm[1]:'',group:gm?gm[1].trim():'Other',url:cleanUrl});
      i++;
    }
  }
  return ch;
}

const ALL=parseM3U(RAW);
let filtered=[...ALL],cur=null,curIdx=-1,hlsObj=null,retries=0,dark=true,playing=false;
const MAXR=3;


function filterChannels(){
  const srch=document.getElementById('searchInput').value.toLowerCase();
  filtered=!srch?[...ALL]:ALL.filter(c=>c.name.toLowerCase().includes(srch)||c.group.toLowerCase().includes(srch));
  renderGrid();
}

/* ═══════════════════════ RENDER GRID ═══════════════════════ */
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderGrid(){
  const grid=document.getElementById('channelGrid');
  if(!filtered.length){grid.innerHTML='<div class="nores">No channels found</div>';return;}
  grid.innerHTML=filtered.map(ch=>{
    const gi=ALL.indexOf(ch),pl=cur&&cur.url===ch.url;
    const abbr=escHtml(ch.name.slice(0,3).toUpperCase());
    const thumb=ch.logo
      ?`<img src="${escHtml(ch.logo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="gc-fb" style="display:none">${abbr}</div>`
      :`<div class="gc-fb">${abbr}</div>`;
    return `<div class="gc${pl?' pl':''}" onclick="playCh(${gi})" data-idx="${gi}">
      <div class="gc-thumb">${thumb}<span class="gc-live">LIVE</span></div>
      <div class="gc-body">
        <div class="gc-name">${escHtml(ch.name)}</div>
        <div class="gc-grp">${escHtml(ch.group)}</div>
      </div>
    </div>`;
  }).join('');
}

/* Panel related list — same group channels */
function renderPanelList(ch){
  const list=document.getElementById('panelList');
  const related=ALL;
  list.innerHTML=`<div style="padding:10px 14px 4px;font-size:.72rem;font-weight:600;color:var(--tm);letter-spacing:.05em">ALL CHANNELS (${ALL.length})</div>`
    +related.map(c=>{
      const gi=ALL.indexOf(c),pl=cur&&cur.url===c.url;
      const logo=c.logo
        ?`<img class="cl" src="${escHtml(c.logo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><div class="clf" style="display:none">${escHtml(c.name.slice(0,3).toUpperCase())}</div>`
        :`<div class="clf">${escHtml(c.name.slice(0,3).toUpperCase())}</div>`;
      return `<div class="ci${pl?' pl':''}" onclick="playCh(${gi})" data-idx="${gi}">
        <span class="cn">${gi+1}</span>${logo}
        <div class="cinfo"><div class="cname">${escHtml(c.name)}</div><div class="cgrp">${escHtml(c.group)}</div></div>
        <div class="ca">
          <button class="cbtn" onclick="event.stopPropagation();copyLink(${gi})" title="Copy">⧉</button>
        </div>
      </div>`;
    }).join('');
}

/* ═══════════════════════ PLAY + PANEL ═══════════════════════ */
function openPlayer(){
  document.getElementById('playerPanel').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
  document.body.style.overflow='hidden';
}
function closePlayer(){
  document.getElementById('playerPanel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  document.body.style.overflow='';
  // Stop stream
  const v=document.getElementById('vid');
  v.pause();
  if(hlsObj){hlsObj.destroy();hlsObj=null;}
  playing=false;updPlay();
  hideSt();
  cur=null;curIdx=-1;
  renderGrid();
}

function playCh(idx){
  curIdx=idx;cur=ALL[idx];retries=0;
  document.getElementById('npl').textContent=cur.name;
  document.getElementById('panelTitle').textContent=cur.name;
  // Mark active in grid
  document.querySelectorAll('.gc').forEach(el=>el.classList.toggle('pl',parseInt(el.dataset.idx)===idx));
  document.querySelectorAll('.ci').forEach(el=>el.classList.toggle('pl',parseInt(el.dataset.idx)===idx));
  clearQuality();
  openPlayer();
  renderPanelList(cur);
  // Scroll active channel into view
  setTimeout(()=>{
    const active=document.querySelector('#panelList .ci.pl');
    if(active)active.scrollIntoView({block:'center',behavior:'smooth'});
  },100);
  loadStream(cur.url);
}

function prevCh(){
  if(curIdx<=0)return;
  playCh(curIdx-1);
}
function nextCh(){
  if(curIdx>=ALL.length-1)return;
  playCh(curIdx+1);
}

/* ═══════════════════════ STREAM ═══════════════════════ */
function loadStream(url){
  const v=document.getElementById('vid');
  showSt('loading','Loading stream...');
  if(hlsObj){hlsObj.destroy();hlsObj=null;}
  if(Hls.isSupported()){
    hlsObj=new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      // Buffer — keep small for live, large means more delay
      backBufferLength:10,
      maxBufferLength:10,
      maxMaxBufferLength:20,
      maxBufferSize:20*1000*1000,   // 20 MB
      // Live sync — jump to live edge fast
      liveSyncDurationCount:2,
      liveMaxLatencyDurationCount:4,
      liveBackBufferLength:5,
      // Start at best level first, then adapt
      startLevel:-1,
      // Faster ABR decisions
      abrEwmaDefaultEstimate:500000,
      // Reduce initial segment fetch count
      maxStarvationDelay:2,
      maxLoadingDelay:2,
    });
    hlsObj.loadSource(url);
    hlsObj.attachMedia(v);
    hlsObj.on(Hls.Events.MANIFEST_PARSED,(_,data)=>{
      hideSt();
      v.play().then(()=>{playing=true;updPlay();}).catch(()=>{});
      buildQualityList(data.levels);
    });
    hlsObj.on(Hls.Events.LEVEL_SWITCHED,(_,data)=>{
      updateQLabel(data.level);
    });
    hlsObj.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)onErr();});
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url;
    v.play().then(()=>{hideSt();playing=true;updPlay();}).catch(()=>onErr());
  }else{
    showSt('error','HLS not supported in this browser.');
  }
}

function onErr(){
  retries++;
  if(retries<=MAXR){
    showSt('loading',`Stream error. Retrying... (${retries}/${MAXR})`);
    setTimeout(()=>{if(cur)loadStream(cur.url);},2000);
  }else{
    showSt('error','Stream unavailable. Channel may be offline or geo-blocked.');
    document.getElementById('rbt').style.display='inline-block';
  }
}

function retryStream(){if(!cur)return;retries=0;document.getElementById('rbt').style.display='none';loadStream(cur.url);}

function showSt(t,msg){
  const o=document.getElementById('so'),sp=document.getElementById('spin'),m=document.getElementById('smsg');
  o.classList.add('show');sp.style.display=t==='loading'?'block':'none';
  m.textContent=msg;m.style.color=t==='error'?'var(--err)':'#fff';
}
function hideSt(){document.getElementById('so').classList.remove('show');}

/* ═══════════════════════ QUALITY SELECTOR ═══════════════════════ */
function clearQuality(){
  document.getElementById('qList').innerHTML='';
  document.getElementById('qLabel').textContent='AUTO';
  document.getElementById('qdrop').classList.remove('open');
}

function buildQualityList(levels){
  const qList=document.getElementById('qList');
  if(!levels||levels.length<=1){
    qList.innerHTML='<div class="ql" style="pointer-events:none;opacity:.5">No quality options</div>';
    return;
  }
  // Auto option
  let html=`<div class="ql act" id="ql-auto" onclick="setQuality(-1)">
    Auto <span class="ql-badge">Adaptive</span>
  </div>`;
  // Level options (sorted best to worst)
  const sorted=[...levels.map((l,i)=>({...l,idx:i}))].sort((a,b)=>(b.height||b.bitrate||0)-(a.height||a.bitrate||0));
  sorted.forEach(l=>{
    const label=l.height?`${l.height}p`:`${Math.round((l.bitrate||0)/1000)}k`;
    const badge=l.bitrate?`${Math.round(l.bitrate/1000)}kbps`:'';
    html+=`<div class="ql" id="ql-${l.idx}" onclick="setQuality(${l.idx})">
      ${label} <span class="ql-badge">${badge}</span>
    </div>`;
  });
  qList.innerHTML=html;
}

function setQuality(level){
  if(!hlsObj)return;
  hlsObj.currentLevel=level;
  // Update UI
  document.querySelectorAll('.ql').forEach(el=>el.classList.remove('act'));
  const target=document.getElementById(level===-1?'ql-auto':`ql-${level}`);
  if(target)target.classList.add('act');
  document.getElementById('qdrop').classList.remove('open');
  if(level===-1){
    document.getElementById('qLabel').textContent='AUTO';
    showToast('Quality: Auto (Adaptive)');
  }else{
    const levels=hlsObj.levels;
    if(levels&&levels[level]){
      const lbl=levels[level].height?`${levels[level].height}p`:`${Math.round((levels[level].bitrate||0)/1000)}k`;
      document.getElementById('qLabel').textContent=lbl;
      showToast(`Quality: ${lbl}`);
    }
  }
}

function updateQLabel(levelIdx){
  if(!hlsObj||hlsObj.autoLevelEnabled)return;
  const levels=hlsObj.levels;
  if(levels&&levels[levelIdx]){
    const lbl=levels[levelIdx].height?`${levels[levelIdx].height}p`:`${Math.round((levels[levelIdx].bitrate||0)/1000)}k`;
    document.getElementById('qLabel').textContent=lbl;
  }
}

function toggleQDrop(e){
  e.stopPropagation();
  document.getElementById('qdrop').classList.toggle('open');
}

// Close quality dropdown when clicking outside
document.addEventListener('click',()=>{
  document.getElementById('qdrop').classList.remove('open');
});

/* ═══════════════════════ PLAYER CONTROLS ═══════════════════════ */
function togglePlay(){
  const v=document.getElementById('vid');
  if(v.paused){v.play();playing=true;}else{v.pause();playing=false;}
  updPlay();
}
function updPlay(){
  document.getElementById('pico').textContent=playing?'⏸':'▶';
}
function updVolumeFill(val){
  const pct=Math.round(val*100);
  const sl=document.getElementById('vs');
  sl.style.background=`linear-gradient(to right,rgba(255,255,255,.9) ${pct}%,rgba(255,255,255,.25) ${pct}%)`;
}
function toggleMute(){
  const v=document.getElementById('vid');
  v.muted=!v.muted;
  document.getElementById('mb').textContent=v.muted?'🔇':'🔊';
  updVolumeFill(v.muted?0:v.volume);
}
function setVolume(val){
  const v=document.getElementById('vid');
  v.volume=val;v.muted=val==0;
  document.getElementById('mb').textContent=val==0?'🔇':'🔊';
  updVolumeFill(val);
  localStorage.setItem('iv',val);
}
function toggleFS(){
  const el=document.getElementById('pa');
  const iconExpand=`<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>`;
  const iconCompress=`<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>`;
  if(!document.fullscreenElement){
    el.requestFullscreen?.();
    document.getElementById('fsIcon').innerHTML=iconCompress;
  }else{
    document.exitFullscreen?.();
    document.getElementById('fsIcon').innerHTML=iconExpand;
  }
}
async function togglePiP(){
  const v=document.getElementById('vid');
  if(document.pictureInPictureElement){await document.exitPictureInPicture();}
  else if(document.pictureInPictureEnabled&&v.readyState>=2){await v.requestPictureInPicture();}
  else showToast('Start a stream first to use PiP');
}

/* ═══════════════════════ TAP / CLICK / DOUBLE-CLICK ═══════════════════════ */
let tapTimer=null,tapCount=0;
const pa=document.getElementById('pa');
const isMobile=()=>window.innerWidth<=700||('ontouchstart' in window);

pa.addEventListener('click',e=>{
  // Ignore clicks on control buttons
  if(e.target.closest('.ctb,.qbtn,.qdrop,.prog-bar,.prog-wrap'))return;

  tapCount++;
  if(tapCount===1){
    tapTimer=setTimeout(()=>{
      tapCount=0;
      if(isMobile()){
        // Mobile: single tap = show overlay only
        showOverlay();
      }else{
        // Desktop: single click = play/pause
        if(cur){togglePlay();flashTapIcon(playing?'⏸':'▶');}
      }
    },250);
  }else if(tapCount===2){
    clearTimeout(tapTimer);tapCount=0;
    // Both mobile & desktop: double tap/click = fullscreen
    toggleFS();
    flashTapIcon('⛶');
  }
});

function flashTapIcon(icon){
  const ti=document.getElementById('tapIcon');
  ti.textContent=icon;
  ti.classList.add('pop');
  setTimeout(()=>ti.classList.remove('pop'),600);
}

/* ═══════════════════════ OVERLAY AUTO-HIDE ═══════════════════════ */
let ot;
const pov=document.getElementById('pov');

function showOverlay(){
  pov.classList.add('vis');
  clearTimeout(ot);
  ot=setTimeout(hideOverlay,3000);
}
function hideOverlay(){
  pov.classList.remove('vis');
}

// Desktop: mouse move
pa.addEventListener('mousemove',showOverlay);
// Desktop: mouse leave hides immediately
pa.addEventListener('mouseleave',()=>{clearTimeout(ot);ot=setTimeout(hideOverlay,500);});
// Mobile: touchstart shows overlay
pa.addEventListener('touchstart',e=>{
  // Don't call showOverlay if touching a button
  if(e.target.closest('.ctb,.qbtn,.qdrop,.prog-bar,.prog-wrap'))return;
  showOverlay();
},{passive:true});

/* ═══════════════════════ PROGRESS BAR (VOD) ═══════════════════════ */
const vid=document.getElementById('vid');
vid.addEventListener('timeupdate',()=>{
  if(vid.duration&&isFinite(vid.duration)){
    const pct=(vid.currentTime/vid.duration)*100;
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('progTime').textContent=fmtTime(vid.currentTime)+' / '+fmtTime(vid.duration);
  }else{
    document.getElementById('progFill').style.width='100%';
    document.getElementById('progTime').textContent='LIVE';
  }
});

// Seek on click
document.getElementById('progBar').addEventListener('click',e=>{
  if(!vid.duration||!isFinite(vid.duration))return;
  const r=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-r.left)/r.width;
  vid.currentTime=pct*vid.duration;
});

function fmtTime(s){
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ═══════════════════════ VIDEO EVENTS ═══════════════════════ */
vid.addEventListener('play',()=>{playing=true;updPlay();hideSt();});
vid.addEventListener('pause',()=>{playing=false;updPlay();});
vid.addEventListener('waiting',()=>{if(cur)showSt('loading','Buffering...');});
vid.addEventListener('playing',hideSt);
vid.addEventListener('error',()=>{if(cur)onErr();});

/* ═══════════════════════ COPY LINK ═══════════════════════ */
function copyLink(idx){
  const url=ALL[idx].url;
  navigator.clipboard.writeText(url).then(()=>showToast('Link copied!')).catch(()=>{
    const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);showToast('Link copied!');
  });
}

/* ═══════════════════════ THEME ═══════════════════════ */
function toggleTheme(){
  dark=!dark;
  document.body.classList.toggle('light',!dark);
  document.getElementById('themeBtn').textContent=dark?'🌙 Dark':'☀️ Light';
  localStorage.setItem('ith',dark?'dark':'light');
}

/* ═══════════════════════ TOAST ═══════════════════════ */
let tTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

/* ═══════════════════════ KEYBOARD ═══════════════════════ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();if(cur)togglePlay();}
  if(e.key==='m'||e.key==='M')toggleMute();
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='p'||e.key==='P')togglePiP();
  if(e.key==='ArrowLeft')prevCh();
  if(e.key==='ArrowRight')nextCh();
  if(e.key==='Escape')closePlayer();
});

/* ═══════════════════════ PANEL SWIPE DOWN TO CLOSE ═══════════════════════ */
(function(){
  const handle=document.getElementById('panelHandle');
  const panel=document.getElementById('playerPanel');
  let startY=0,dragging=false;
  handle.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;dragging=true;},{passive:true});
  handle.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dy=e.touches[0].clientY-startY;
    if(dy>0)panel.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  handle.addEventListener('touchend',e=>{
    dragging=false;
    const dy=e.changedTouches[0].clientY-startY;
    panel.style.transform='';
    if(dy>100)closePlayer();
  });
})();

/* ═══════════════════════ INIT ═══════════════════════ */
(function(){
  const sv=localStorage.getItem('ith');
  if(sv==='light'){dark=false;document.body.classList.add('light');document.getElementById('themeBtn').textContent='☀️ Light';}
  const vv=localStorage.getItem('iv');
  if(vv!==null){
    setTimeout(()=>{
      const val=parseFloat(vv);
      vid.volume=val;
      document.getElementById('vs').value=vv;
      updVolumeFill(val);
    },0);
  }else{
    updVolumeFill(1);
  }
  document.getElementById('totalCount').textContent=`${ALL.length} channels`;
  renderGrid();
})();
</script>
